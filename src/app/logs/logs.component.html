<section class="logs-page">
  <header><h1>Journal du poêle</h1><span class="live"><span class="live-dot"></span> Actualisation automatique · 2 s</span></header>
  <div class="controls">
    <input aria-label="Rechercher dans le journal" placeholder="Rechercher…" [(ngModel)]="filter" />
    <select aria-label="Seuil de gravité" [(ngModel)]="level">
      <option value="WARN">WARN+ · avertissements et erreurs</option>
      <option value="INFO">INFO+ · informations et erreurs</option>
      <option value="ALL">Tous · y compris DEBUG</option>
    </select>
    <button (click)="exportCsv()">Exporter CSV</button>
    <span class="count">{{filtered.length}} message(s)</span>
  </div>
  <div class="error" *ngIf="error" role="alert">{{error}}</div>
  <div class="table-scroll" role="region" aria-label="Messages du poêle" tabindex="0">
    <table>
      <thead><tr>
        <th (click)="setSort('date')" title="Trier par date">Date ↕</th>
        <th (click)="setSort('level')" title="Trier par niveau">Niveau ↕</th>
        <th (click)="setSort('message')" title="Trier par message">Message ↕</th>
        <th>Détails</th>
      </tr></thead>
      <tbody>
        <tr *ngFor="let r of filtered">
          <td class="date">{{r.date}}</td>
          <td><span class="level" [attr.data-level]="r.level">{{r.level}}</span></td>
          <td class="message">{{r.message}}</td>
          <td><button *ngIf="r.details" (click)="expanded=expanded===rowKey(r)?null:rowKey(r)">{{expanded===rowKey(r)?'Masquer':'Afficher'}}</button>
            <div class="details" *ngIf="expanded===rowKey(r)">{{r.details}}</div></td>
        </tr>
        <tr *ngIf="!filtered.length"><td colspan="4">Aucun message pour ce filtre.</td></tr>
      </tbody>
    </table>
  </div>
</section>
